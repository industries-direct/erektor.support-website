<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EREKTOR">
  <!--
    One leg, reduced from its own elevation drawing in tools/diagrams.py: the
    bracket face it hangs from the station rail by, the lift column, the base
    spine, and the three casters it stands on.

    The right-hand caster is the driven one and carries the accent, which is
    the same rule the diagrams and the service routes follow — red is the part
    that acts. The ink follows the tab bar's theme; the accent never does,
    because it means something.

    Rendered from here to favicon.ico and apple-touch-icon.png; see
    tools/icons.py. Edit this file, not the raster output.
  -->
  <style>
    .ink { fill: #1b1b1b; stroke: #1b1b1b; }
    @media (prefers-color-scheme: dark) { .ink { fill: #ffffff; stroke: #ffffff; } }
  </style>
  <g class="ink">
    <rect x="10.5" y="2.5" width="11" height="3" rx="1" stroke="none"/>
    <rect x="14.25" y="5.5" width="3.5" height="11" stroke="none"/>
    <rect x="6" y="16.5" width="20" height="3" rx="1" stroke="none"/>
    <g stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M10.5 19.5 L7 23.5"/>
      <path d="M16 19.5 L16 23.5"/>
    </g>
    <circle cx="7" cy="26.5" r="2.8" stroke="none"/>
    <circle cx="16" cy="26.5" r="2.8" stroke="none"/>
  </g>
  <g stroke="#e02020" fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M21.5 19.5 L25 23.5"/>
  </g>
  <circle cx="25" cy="26.5" r="2.8" fill="#e02020"/>
</svg>
